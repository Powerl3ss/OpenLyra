[package]
name = "lyra"
version = "1.2.0"
edition = "2021"
description = "Analyse et nettoyage des métadonnées cachées des documents"
repository = "https://github.com/Powerl3ss/OpenLyra"

[dependencies]
eframe = "0.31"
rfd = "0.15"
anyhow = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
lopdf = "0.36"
quick-xml = "0.31"
kamadak-exif = "0.6"
flate2 = "1"
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
self-replace = "1"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
